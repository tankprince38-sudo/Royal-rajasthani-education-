
backend:
  name: github
  repo: tankprince38-sudo/Royal-rajasthani-education-
  branch: main

media_folder: "uploads/pdfs"
public_folder: "/uploads/pdfs"

collections:
  - name: "content"
    label: "Subjects and Chapters"
    files:
      - name: "catalog"
        label: "Study Content"
        file: "content/catalog.json"
        format: "json"
        fields:
          - name: "subjects"
            label: "Subjects"
            widget: "list"
            fields:
              - name: "name"
                label: "Subject Name"
                widget: "string"
              - name: "chapters"
                label: "Chapters"
                widget: "list"
                fields:
                  - name: "name"
                    label: "Chapter Name"
                    widget: "string"
                  - name: "pdf"
                    label: "Chapter PDF"
                    widget: "file"
                    required: false
                  - name: "notes"
                    label: "Notes PDF"
                    widget: "file"
                    required: false
                  - name: "mcqs"
                    label: "MCQs PDF"
                    widget: "file"
                    required: false
                  - name: "questions_answers"
                    label: "Questions and Answers PDF"
                    widget: "file"
                    required: false
                  - name: "revision"
                    label: "Revision PDF"
                    widget: "file"
                    required: false

