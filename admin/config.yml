
backend:
  name: github
  repo: tankprince38-sudo/Royal-rajasthani-education-
  branch: main

media_folder: "uploads/pdfs"
public_folder: "/uploads/pdfs"

collections:
  - name: "content"
    label: "Study Content"
    files:
      - name: "catalog"
        label: "Subjects and Chapters"
        file: "content/catalog.json"
        format: "json"
        fields:
          - name: "subjects"
            label: "Subjects"
            widget: "list"
            fields:
              - name: "name"
                label: "Subject Name"
                widget: "string"
              - name: "chapters"
                label: "Chapters"
                widget: "list"
                fields:
                  - name: "name"
                    label: "Chapter Name"
                    widget: "string"
                  - name: "pdf"
                    label: "PDF File"
                    widget: "file"
